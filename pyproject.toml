[project]
name = "farma"
version = "0.1.0"
description = "Pharmacy driving time analysis for northern Vermont counties"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests",
    "geopandas",
    "shapely",
    "folium",
    "numpy",
    "pandas",
    "matplotlib",
    "seaborn",
    "python-dotenv",
    "jupyter",
    "scipy>=1.17.1",
    "rich>=14.3.3",
    "scikit-learn>=1.8.0",
    "geobuf>=2.0.1",
    "ipywidgets>=8.1.8",
]
